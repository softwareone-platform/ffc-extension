version: {{ settings.extension_version }}
openapi: /bypass/openapi.json
events:
  - event: platform.commerce.order.created
    condition: "and(in(type,(Purchase,Change,Termination)),eq(status,Processing),eq(product.id,{{ settings.mpt_product_id }}))"
    path: "/events/commerce/orders"
    task: true
  - event: platform.commerce.order.status_changed
    condition: "and(in(type,(Purchase,Change,Termination)),eq(status,Processing),eq(product.id,{{ settings.mpt_product_id }}))"
    path: "/events/commerce/orders"
    task: true
{% if products %}
  - event: platform.commerce.subscription.status_changed
    condition: "and(in(status,(Active,Terminated)),in(product.id,{{ products|join(',') }}))"
    path: "/events/commerce/subscriptions"
    task: true
  - event: platform.commerce.subscription.created
    condition: "in(product.id,{{ products|join(',') }})"
    path: "/events/commerce/subscriptions"
    task: true
{% endif %}
webhooks:
  - type: ValidateChangeOrderDraft
    description: Validate draft change orders.
    path: "/events/commerce/orders/validate"
    criteria:
      product.id: {{ settings.mpt_product_id }}
plugs:
- id: finops{% if settings.ui_plugs_prefix != "ffc" %}_{{ settings.ui_plugs_prefix }}{% endif %}
  name: FinOps for Cloud {% if settings.ui_plugs_prefix != "ffc" %} ({{ settings.ui_plugs_prefix }}){% endif %}
  description: This section shows all of the customers Organisations created in FinOps.
  icon: query_stats
  socket: portal.root
  href: "/static/StandaloneRoot-{{ settings.extension_version }}.js"
