name: Frontend tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure npm authentication
        run: |
          cat <<EOF > ~/.npmrc
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/registry/:username=github
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/registry/:_password="${NPM_TOKEN_BASE64}"
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/registry/:email=github@softwareone.com
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/:username=github
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/:_password="${NPM_TOKEN_BASE64}"
          //softwareone-pc.pkgs.visualstudio.com/_packaging/PyraCloud/npm/:email=github@softwareone.com
          EOF
        env:
          NPM_TOKEN_BASE64: ${{ secrets.AZURE_DEVOPS_NPM_TOKEN_BASE64 }}

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Unit Tests with Coverage
        run: cd frontend && npm run test:coverage

      - name: Build and validate frontend
        run: cd frontend && npm run check:all

      # On pull_request the checkout is the merge commit, not the PR head that
      # workflow_run reports, so the Sonar workflow needs to be told which
      # commit the coverage line numbers belong to.
      - name: Record the tested commit
        run: git rev-parse HEAD > frontend/coverage/tested-sha.txt

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/tested-sha.txt
          if-no-files-found: error
